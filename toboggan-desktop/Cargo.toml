[package]
name = "toboggan-desktop"
version.workspace = true
description = "Cross-platform desktop application for Toboggan presentations using iced"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.cargo-machete]
# naga is pulled in only to force its `termcolor` feature on a transitive
# dependency of iced/wgpu (see https://github.com/gfx-rs/wgpu/pull/7482);
# we never `use` the crate ourselves.
ignored = ["naga"]

[dependencies]
toboggan-core = { path = "../toboggan-core", features = ["std"] }
toboggan-client = { path = "../toboggan-client" }

iced = { workspace = true, features = [
  "tokio",
  "advanced",
  "markdown",
  "highlighter",
  "image",
] }
# Force naga termcolor feature - see https://github.com/gfx-rs/wgpu/pull/7482
naga = { workspace = true, features = ["termcolor"] }
lucide-icons = { workspace = true }

tokio = { workspace = true, features = ["full"] }
async-stream = { workspace = true }

anyhow = { workspace = true }
# Opening a link from a slide. The same crate the server uses for `--open`, so
# the desktop and the CLI hand a URL to the platform the same way.
open = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
