# Builds and publishes prebuilt `toboggan` binaries when a version tag is pushed.
#
# These releases let the `ilaborie/toboggan` GitHub Action install the CLI via
# `cargo binstall` instead of compiling from source on every run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pushing a tag does not create a GitHub Release, and
  # `upload-rust-binary-action` does not create one either — it attaches assets
  # to a release that must already exist. Without this job it retried
  # "release not found" eleven times and failed on every target, after building
  # all three binaries. It has to be its own job so the three matrix legs attach
  # to one release instead of racing to create it.
  create-release:
    name: Create the GitHub release
    # A manual rehearsal has no tag, so there is nothing to create; the upload
    # job is in dry-run then and needs no release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Idempotent so that re-running a partially failed release works:
        # `gh release create` errors if the release is already there.
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it alone"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag
          fi

  upload:
    name: ${{ matrix.target }}
    needs: create-release
    # `create-release` is skipped on a manual rehearsal; without this the whole
    # upload matrix would be skipped with it and the rehearsal would test
    # nothing.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # The Intel macOS runner. `macos-latest` is Apple silicon, so the
          # x86_64 binary needs an explicitly-Intel label; `macos-13` — the one
          # this used to name — has since been retired by GitHub, which would
          # have failed this matrix leg at scheduling time on the first tag.
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `toboggan` embeds the web client through toboggan-server's RustEmbed, and
      # its build.rs fails outright when `toboggan-web/dist` is missing. Unlike
      # CI — which stubs the folder because it only type-checks the Rust — a
      # release binary has to carry the real bundle, so it is built here.
      # Mirrors `mise build:web`; wasm-opt flags come from the wasm crate's
      # `[package.metadata.wasm-pack]`, so no binaryen install is needed.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: toboggan-web/pnpm-lock.yaml
      - name: Build embedded web client
        run: |
          wasm-pack build --target web --no-pack --release --out-dir pkg toboggan-web/toboggan-wasm
          cd toboggan-web
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Verify the embedded bundle exists
        run: test -f toboggan-web/dist/index.html

      # A manual run has no tag to attach assets to, so it stops just short of
      # uploading. That makes `workflow_dispatch` a genuine rehearsal of this
      # workflow — wasm-pack, pnpm, the release build and the archiving all run
      # for real — instead of a run that is guaranteed to go red on the last
      # step. Worth having: everything here first executes on a `v*` tag, which
      # is the worst moment to discover it does not work.
      - name: Build and upload toboggan
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: toboggan
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          dry-run-intended: ${{ github.event_name == 'workflow_dispatch' }}
