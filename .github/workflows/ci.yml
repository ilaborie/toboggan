# Server-side gate for the repo's three Cargo workspaces.
#
# Why this exists: the repo's prek hooks are installed as *git* hooks
# (.git/hooks/pre-commit, pre-push), but jj — the project's primary VCS — does
# not run git hooks. So for a jj-driven workflow the fmt/clippy/test gate never
# fires locally. This workflow re-runs the same checks as `mise check:rust` on
# every push and pull request, regardless of the contributor's VCS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root workspace. Runs on macOS to mirror the development environment
  # (where `mise check` is known green) and to avoid Linux GUI system-dependency
  # setup for the iced/wgpu-based `toboggan-desktop` crate.
  rust:
    name: Rust (fmt + clippy + nextest + doctests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # toboggan-server embeds `toboggan-web/dist` at compile time (RustEmbed),
      # and its build.rs fails if the folder is missing. That bundle is a
      # gitignored build artifact produced by the separate wasm/vite pipeline.
      # Stub a minimal dist so the Rust gate can compile the server without the
      # full web toolchain. The stub is only ever compiled against, never
      # shipped: the release workflow builds the real bundle before it produces a
      # binary. Anything that depends on the dist's *contents* is therefore not
      # covered here.
      # Both entry points, because `build.rs` asserts both: `/presenter` is
      # served from its own page, and a dist missing it used to compile here and
      # 404 at runtime.
      - name: Stub embedded web dist
        run: |
          mkdir -p toboggan-web/dist
          for page in index.html presenter.html; do
            printf '<!doctype html><title>ci stub</title>' > "toboggan-web/dist/$page"
          done

      # Install nightly first, stable last, so stable is the default toolchain;
      # the only nightly user is the explicit `cargo +nightly fmt` below. Every
      # command pins its toolchain so the result does not depend on action order.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Format (nightly)
        run: cargo +nightly fmt --all --check
      - name: Clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo +stable nextest run
      - name: Doctests
        run: cargo +stable test --doc
      # Crate READMEs are included into their crate docs, so a broken intra-doc
      # link or an example that stopped compiling fails here rather than being
      # discovered by whoever reads docs.rs.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --workspace

  # The embedded web client is a *separate* Cargo workspace (rooted at
  # toboggan-web/Cargo.toml), so the `rust` job above never reaches
  # it: neither `--all-targets` nor `nextest run` crosses a workspace boundary,
  # and `mise check:rust` has the same blind spot locally. Until this job
  # existed, `toboggan-wasm` was only ever compiled by the release workflow —
  # meaning a break surfaced when a `v*` tag was pushed, after the tag existed.
  #
  # Ubuntu rather than macOS: nothing here needs a GUI toolchain, and building
  # the wasm crate on Linux is exactly what the release workflow does for the
  # x86_64-unknown-linux-gnu binary, so this doubles as a smoke test for it.
  wasm:
    name: Web client (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toboggan-web/toboggan-wasm
    steps:
      - uses: actions/checkout@v7

      # Same ordering rule as the `rust` job: nightly first so stable ends up
      # the default toolchain, with every command pinning its own anyway.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The workspace root is `toboggan-web`; the crate is a member of it.
          workspaces: toboggan-web

      - name: Format (nightly)
        run: cargo +nightly fmt --all --check
      # Linted against wasm32, the only target this crate is ever built for:
      # its web-sys/beamterm surface is meaningless on a host target, so a
      # host-target lint would check code the browser never runs.
      - name: Clippy (wasm32)
        run: cargo +stable clippy --all-targets --target wasm32-unknown-unknown -- -D warnings
      # No test step: the crate has no tests, and running any would need
      # wasm-bindgen-test-runner plus a headless browser. `--all-targets` above
      # still type-checks whatever test code gets added later.

  # The Python bindings. `toboggan-py` is the repo's third Cargo workspace — it
  # is in the root manifest's `exclude` list, so the `rust` job's `--all-targets`
  # and `nextest run` never reach it, exactly as they do not reach the wasm
  # crate. It went uncovered long enough for two real defects to ship: an
  # unformatted `lib.rs`, and a `TobogganApi::clients()` that failed to
  # deserialize on every call because the bindings are its only caller.
  #
  # Unlike the `wasm` job this one runs tests, because the interesting behaviour
  # is in the round trip: a command has to have landed by the time the call
  # returns. That needs a real server, so the job builds one.
  python:
    name: Python bindings (fmt + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same ordering rule as the `rust` job: nightly first so stable ends up
      # the default toolchain, with every command pinning its own anyway.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Two roots: the crate itself, and the workspace that builds the
          # server the tests run against.
          workspaces: |
            .
            toboggan-py
      - uses: astral-sh/setup-uv@v10.0.1

      # `toboggan-server`'s build.rs needs this folder to exist. The Python
      # tests never look at the web UI, so a stub is enough — building the real
      # bundle would cost a wasm-pack and a pnpm install for nothing.
      - name: Stub embedded web dist
        run: |
          mkdir -p toboggan-web/dist
          for page in index.html presenter.html; do
            printf '<!doctype html><title>ci stub</title>' > "toboggan-web/dist/$page"
          done

      # Before the build: these take seconds and the build takes minutes, so a
      # formatting slip should not cost a full compile to discover.
      - name: Format (nightly)
        working-directory: toboggan-py
        run: cargo +nightly fmt --all --check
      - name: Clippy
        working-directory: toboggan-py
        run: cargo +stable clippy --all-targets -- -D warnings

      - name: Build the server the tests drive
        run: cargo build -p toboggan

      # `--no-sync` on both: `uv sync` reuses a cached wheel rather than
      # rebuilding changed Rust, and a bare `uv run` re-syncs first, which would
      # put that stale wheel back over what `maturin develop` just built.
      - name: Tests
        working-directory: toboggan-py
        env:
          TOBOGGAN_BIN: ${{ github.workspace }}/target/debug/toboggan
          # A runner controls its own environment, so a missing deck, a missing
          # server or a missing LAN address is a broken job rather than a fact
          # of life. Without this, pytest exits 0 having run nothing — and the
          # nine role tests, the only coverage of the token-on-REST fix and the
          # 403 mapping, are exactly the ones that skip first.
          TOBOGGAN_PY_STRICT: "1"
        run: |
          uv sync --group dev
          uv run --no-sync maturin develop --uv
          uv run --no-sync pytest

      # After the build: `stubtest` imports the module to compare it against the
      # stub, and `mypy` checks the documented usage against that same stub.
      - name: Lint and type-check the Python
        working-directory: toboggan-py
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync python -m mypy.stubtest toboggan_py \
            --allowlist stubtest-allowlist.txt

  # Unused dependencies. `cargo machete` is a mise tool locally, but the repo's
  # prek hooks are git hooks and jj does not run them, so it never fired for the
  # VCS this project actually uses.
  deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # Runs the project against its own decks.
  #
  # Everything above type-checks Rust; nothing above proves that `toboggan` can
  # still read a folder of Markdown, that the embedded web client boots, or that
  # the PDF exporter emits Typst that compiles. Those broke in ways the Rust gate
  # cannot see — a one-backtick table cell produced a `.typ` that typst refused,
  # and no test noticed because no test had ever built a real deck.
  #
  # Ubuntu, with the real web bundle: the `rust` job stubs `toboggan-web/dist`,
  # so it is the one job here that says anything about the shipped client.
  deck:
    name: Build and serve the example decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: toboggan-web/pnpm-lock.yaml
      - name: Install Typst
        uses: typst-community/setup-typst@v5

      # Mirrors `mise build:web`. Must happen before the Rust build: the server
      # embeds this folder and its build.rs fails without it.
      - name: Build the embedded web client
        run: |
          wasm-pack build --target web --no-pack --release --out-dir pkg toboggan-web/toboggan-wasm
          cd toboggan-web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build toboggan
        run: cargo build -p toboggan

      # A parser or rule regression shows up here as a failure on a real deck
      # rather than as a surprise during someone's talk.
      - name: Lint the example decks
        run: |
          ./target/debug/toboggan lint -p examples/toboggan-guide/slides --deny warning
          ./target/debug/toboggan lint -p examples/riir-folder --deny warning

      # `toboggan-guide.toml` is a *prebuilt* artifact that the server embeds
      # with include_str!, so it can drift from the slides it was built from and
      # nothing would say so. Rebuild it and insist it did not change.
      - name: The built guide matches its slides
        run: |
          ./target/debug/toboggan build \
            -p examples/toboggan-guide/slides \
            -o examples/toboggan-guide/toboggan-guide.toml
          git diff --exit-code -- examples/toboggan-guide/toboggan-guide.toml \
            || {
              echo "::error file=examples/toboggan-guide/toboggan-guide.toml::the built guide is out of date; rebuild it and commit the result"
              exit 1
            }

      - name: Export every format
        run: |
          ./target/debug/toboggan build -p examples/toboggan-guide/slides -o /tmp/guide.html
          ./target/debug/toboggan build -p examples/riir-folder -o /tmp/riir.html
          ./target/debug/toboggan pdf -p examples/toboggan-guide/slides -o /tmp/guide.pdf
          test -s /tmp/guide.pdf

      # The deck is compiled Rust behind a shadow root: a page can answer 200
      # with a blank body when the wasm bundle fails to boot, so the assertions
      # wait for something the client itself had to render.
      - name: Install Playwright browsers
        working-directory: toboggan-web
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test the served deck
        working-directory: toboggan-web
        env:
          TOBOGGAN_BIN: ../target/debug/toboggan
        run: pnpm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: toboggan-web/playwright-report/
          retention-days: 7
