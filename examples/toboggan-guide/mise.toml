#:schema https://mise.jdx.dev/schema/mise.json
# Build + serve tasks for the Toboggan user guide.
# Requires the unified `toboggan` CLI on PATH (cargo install --path toboggan).

[tasks.build]
description = "Compile slides/ into toboggan-guide.toml (the served artifact)"
run = "toboggan build ./slides/ --output toboggan-guide.toml"

[tasks.html]
description = "Export a single-file static HTML version"
run = "toboggan build ./slides/ --output toboggan-guide.html"

[tasks.pdf]
description = "Export a PDF handout (needs `typst`)"
run = "toboggan pdf ./slides/ --output toboggan-guide.pdf"

[tasks.dev]
description = "Build + serve with live reload while editing the slides"
run = "RUST_LOG=info toboggan ./slides/"

[tasks.run]
description = "Serve the compiled guide"
run = "toboggan serve --public-dir ./public/ ./toboggan-guide.toml"
