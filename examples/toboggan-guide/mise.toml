#:schema https://mise.jdx.dev/schema/mise.json
# Build + serve tasks for the Toboggan user guide.
# Requires the unified `toboggan` CLI on PATH (cargo install --path toboggan).

# Runs from the repository root with the exact paths the `ci.yml` guide-diff step
# uses, because this artifact is committed and CI rebuilds it and fails on any
# diff. The paths are not cosmetic: `toboggan build` bakes each live terminal's
# *resolved* cwd into the output, joining the `<!-- term: … -->` value with the
# directory of the slide file it appears in — so whatever `-p` prefix that slide
# path carries ends up in the artifact. Built from here with `-p ./slides/` the
# deck is correct in every other way, and CI still rejects it on two paths.
# (`quake_cwd` is baked the same way, against the `-p` root rather than the slide
# file; this deck declares none.)
#
# Only `build` and `run` are path-sensitive. `html` and `pdf` drop live terminals
# from their output and are gitignored, and `dev` builds and serves from a single
# cwd — their `-p ./slides/` is correct as it stands, so do not "fix" it.
[tasks.build]
description = "Compile slides/ into toboggan-guide.toml (the served artifact)"
dir = "../.."   # two levels up: the repository root
run = """
toboggan build \
  -p examples/toboggan-guide/slides \
  --output examples/toboggan-guide/toboggan-guide.toml
"""

[tasks.html]
description = "Export a single-file static HTML version"
run = "toboggan build -p ./slides/ --output toboggan-guide.html"

[tasks.pdf]
description = "Export a PDF handout (needs `typst`)"
run = "toboggan pdf -p ./slides/ --output toboggan-guide.pdf"

[tasks.dev]
description = "Build + serve with live reload while editing the slides"
run = "RUST_LOG=info toboggan -p ./slides/"

# Also from the repository root, for the same reason seen from the other end: the
# cwds baked into the artifact are relative to the root, and the server resolves
# them against its own working directory. Served from this folder, both live
# terminals in the deck would look for `examples/toboggan-guide/…` *inside*
# `examples/toboggan-guide/`, and the socket would close right after the upgrade
# with `Terminal cwd does not exist` in the server log.
[tasks.run]
description = "Serve the compiled guide"
dir = "../.."   # two levels up: the repository root
run = """
toboggan serve \
  --public-dir examples/toboggan-guide/public \
  -p examples/toboggan-guide/toboggan-guide.toml
"""
