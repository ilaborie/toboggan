<h1>Stepped reveals</h1>
<p>Split a slide into steps with a <code>pause</code> comment:</p>
<pre style="background-color:#eff1f5;"><code class="language-markdown"><span style="color:#4f5b66;">First point.
</span><span style="color:#4f5b66;">
