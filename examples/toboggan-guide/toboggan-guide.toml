[slides.notes]
type = "Html"
raw = """
<p>Slides render at <code>/run</code>, and only <code>/public/</code> is mapped to a directory on disk,
which is why the prefix matters.</p>
<p>This is the single most common way a deck breaks between the laptop and the
projector: the image is right there on disk, the URL is one segment off, and the
slide renders with a broken image icon in front of the room.</p>
<p><code>toboggan build -o deck.html</code> copies <code>public/</code> next to the exported file, so a
deck stays self-contained when you publish it. When <em>serving</em>, <code>--public-dir</code>
overrides which folder is mounted at <code>/public</code> — it is a serve flag, not a
build one.</p>
"""
