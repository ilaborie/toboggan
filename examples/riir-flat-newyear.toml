[slides.title]
type = "Text"
text = "2. Rust, le couteau suisse moderne"

[slides.body]
type = "Html"
raw = """
<p>Au-delà des outils CLI</p>
<p>Les forces de Rust</p>
<p>Rust ne se limite pas aux applications terminal :</p>
<h4>Web &amp; Backend</h4>
<ul>
<li><strong>Actix-web</strong>, <strong>Axum</strong> : Serveurs web haute performance</li>
<li><strong>Diesel</strong>, <strong>SQLx</strong> : ORMs type-safe</li>
<li><strong>Tokio</strong> : Runtime async de référence</li>
</ul>
<h4>Applications Desktop</h4>
<ul>
<li><strong>Tauri</strong> : Alternative à Electron</li>
<li><strong>egui</strong>, <strong>iced</strong> : GUI natives</li>
<li><strong>Bevy</strong> : Moteur de jeu en ECS</li>
</ul>
<h4>Microcontrôleurs &amp; IoT</h4>
<ul>
<li><strong>Embassy</strong> : Framework async pour embedded</li>
<li>Support natif ARM, RISC-V</li>
<li>Consommation mémoire optimisée</li>
</ul>
<h4>Blockchain &amp; Crypto</h4>
<ul>
<li><strong>Solana</strong> : Runtime blockchain</li>
<li><strong>Substrate</strong> : Framework pour blockchains</li>
<li>Performances critiques + sécurité</li>
</ul>
<ol>
<li><strong>Zero-cost abstractions</strong> : Performance sans compromis</li>
<li><strong>Memory safety</strong> : Pas de garbage collector, pas de segfault</li>
<li><strong>Concurrence</strong> : Ownership model + async/await</li>
<li><strong>Écosystème</strong> : Cargo + crates.io</li>
<li><strong>Cross-platform</strong> : Linux, macOS, Windows, WASM, mobile</li>
</ol>"""
alt = """
Au-delà des outils CLI
Les forces de Rust
Rust ne se limite pas aux applications terminal :
#### Web & Backend
- **Actix-web**, **Axum** : Serveurs web haute performance
- **Diesel**, **SQLx** : ORMs type-safe
- **Tokio** : Runtime async de référence
#### Applications Desktop
- **Tauri** : Alternative à Electron
