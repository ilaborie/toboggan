[slides.title]
type = "Text"
text = "Conclusion"

[slides.body]
type = "Html"
raw = """
<p>RIIR : Pas qu’un mème</p>
<p>Quand envisager Rust ?</p>
<p>Le futur est rouillé ? 🦀</p>
<ul>
<li><strong>Réalité technique</strong> : Gains mesurables performance/fiabilité</li>
<li><strong>Écosystème mature</strong> : Outils production-ready</li>
<li><strong>Adoption croissante</strong> : Startups → GAFAM</li>
</ul>
<p>✅ <strong>OUI</strong> pour :</p>
<ul>
<li>Performance critique</li>
<li>Sécurité prioritaire</li>
<li>Code partagé multi-plateformes</li>
<li>Outils système</li>
</ul>
<p>❌ <strong>NON</strong> pour :</p>
<ul>
<li>Prototypage rapide</li>
<li>Équipe junior exclusive</li>
<li>Deadline très serrée</li>
<li>Domain métier complexe</li>
</ul>
<p>Rust n’est pas la solution à tout, mais il repousse les limites du possible.</p>
<p><strong>Question finale</strong> : <em>“Have you considered Rewriting It In Rust?”</em></p>
<p>Peut-être que la réponse n’est plus si farfelue…</p>"""
