[slides.title]
type = "Text"
text = "3. Rust s’intègre partout"

[slides.body]
type = "Html"
raw = """
<p>WebAssembly (WASM)</p>
<p>Python avec PyO3 + Maturin</p>
<p>Mobile avec UniFFI</p>
<p>Autres intégrations</p>
<pre><code class="language-rust">use wasm_bindgen::prelude::*;

#[wasm_bindgen]
pub fn process_data(input: &amp;str) -&gt; String {
    // Logique métier en Rust
    format!("Processed: {}", input)
}
</code></pre>
<ul>
<li>Performance native dans le navigateur</li>
<li>Interopérabilité JavaScript seamless</li>
<li>Utilisé par Figma, Discord, Dropbox</li>
</ul>
<pre><code class="language-rust">use pyo3::prelude::*;

#[pyfunction]
fn compute_heavy_task(data: Vec&lt;f64&gt;) -&gt; PyResult&lt;f64&gt; {
    // Calculs intensifs en Rust
    Ok(data.iter().sum())
}

#[pymodule]
fn mymodule(_py: Python, m: &amp;PyModule) -&gt; PyResult&lt;()&gt; {
    m.add_function(wrap_pyfunction!(compute_heavy_task, m)?)?;
    Ok(())
}
</code></pre>
<ul>
<li>Accélération des parties critiques</li>
<li>Distribution via pip</li>
<li>Exemples : Pydantic v2, Polars</li>
</ul>
<pre><code class="language-rust">// Logique métier partagée
pub struct UserService {
    // ...
}

impl UserService {
    pub fn authenticate(&amp;self, token: String) -&gt; Result&lt;User, Error&gt; {
        // ...
    }
}
</code></pre>
<ul>
<li>
<p>Code partagé iOS/Android</p>
</li>
<li>
<p>Bindings automatiques Swift/Kotlin</p>
</li>
<li>
<p>Utilisé par Mozilla Firefox</p>
</li>
<li>
<p><strong>Node.js</strong> : NAPI-RS</p>
</li>
<li>
<p><strong>Ruby</strong> : magnus, rutie</p>
</li>
<li>
<p><strong>C/C++</strong> : FFI direct</p>
</li>
<li>
<p><strong>Java</strong> : JNI</p>
</li>
<li>
<p><strong>Go</strong> : CGO</p>
</li>
</ul>"""
