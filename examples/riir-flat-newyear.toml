[slides.title]
type = "Text"
text = "4. Rust en startup : Retour d’expérience"

[slides.body]
type = "Html"
raw = """
<p>Pourquoi choisir Rust en startup ?</p>
<p>Stratégie d’adoption progressive</p>
<p>Success stories startup</p>
<h4>Avantages</h4>
<ul>
<li><strong>Performance</strong> : Moins de serveurs = coûts réduits</li>
<li><strong>Fiabilité</strong> : Moins de bugs en production</li>
<li><strong>Productivité</strong> : Détection d’erreurs à la compilation</li>
<li><strong>Évolutivité</strong> : Refactoring sûr et confiant</li>
</ul>
<h4>Défis</h4>
<ul>
<li><strong>Courbe d’apprentissage</strong> : Concepts ownership/borrowing</li>
<li><strong>Écosystème</strong> : Plus jeune que Java/.NET</li>
<li><strong>Recrutement</strong> : Développeurs Rust plus rares</li>
</ul>
<ol>
<li><strong>Microservices critiques</strong> : Performance-sensitive</li>
<li><strong>Outils internes</strong> : CLI, scripts automation</li>
<li><strong>Extensions</strong> : Plugins Python/Node.js</li>
<li><strong>Migration graduelle</strong> : Module par module</li>
</ol>
<ul>
<li><strong>Discord</strong> : Backend haute performance</li>
<li><strong>Dropbox</strong> : Storage engine</li>
<li><strong>Figma</strong> : Moteur de rendu WASM</li>
<li><strong>Vercel</strong> : Bundlers (SWC, Turbo)</li>
</ul>"""
alt = """
Pourquoi choisir Rust en startup ?
Stratégie d’adoption progressive
Success stories startup
#### Avantages
- **Performance** : Moins de serveurs = coûts réduits
- **Fiabilité** : Moins de bugs en production
- **Productivité** : Détection d’erreurs à la compilation
