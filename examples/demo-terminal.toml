title = "Toboggan"
date = "2026-04-04"
head = """
<style>
\t/*
\t * Slide bodies render in a shadow root, so descendant selectors like
\t * `.toboggan-slide h1` silently do nothing from here. Custom properties do
\t * cross the boundary, which is why the sizes below are set as variables on
\t * the host rather than as rules on the elements.
\t *
\t * The base is 32px, so the stock 350% h1 renders at 112px — most of a slide
\t * before a single line of content. These bring the headings back to a size
\t * that leaves room for what the slide is actually demonstrating, and shrink
\t * code enough that the longer samples fit without scrolling.
\t */
\t/*
\t * Everything downstream is expressed in % and em, so the root size is the
\t * one lever that scales the whole deck at once — including the alert blocks
\t * and lists that no variable reaches. It does not touch the embedded
\t * terminals, whose font size is a constant in the client, which is what we
\t * want: the shell stays readable while the prose around it gets denser.
\t */
\thtml {
\t\tfont-size: 25px;
\t}

\t.toboggan-slide {
\t\t--slide-h1-size: 210%;
\t\t--slide-h2-size: 150%;
\t\t--slide-h3-size: 120%;
\t\t--slide-code-size: 80%;
\t\t--slide-table-size: 75%;
\t}
</style>
"""

