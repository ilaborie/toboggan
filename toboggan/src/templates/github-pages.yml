# Publishes this presentation to GitHub Pages.
#
# Generated by `toboggan ci`. Everything below is yours to edit — nothing reads
# this file back. Re-run `toboggan ci --force` after upgrading toboggan to move
# the pinned action version.
#
# Requires "Build and deployment -> Source: GitHub Actions" in the repository's
# Pages settings. Until that is set the deploy job fails and nothing else is
# affected.
name: Publish presentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref rather than one shared `pages` group: with `pull_request` among the
# triggers, a shared group would let one pull request cancel another's build.
# Only pushes to the default branch reach the deploy job, so publishing stays
# serialized and a newer commit still wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the deck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint and build the deck
        id: build
        uses: ilaborie/toboggan@{{version}}
        with:
          folder: {{folder}}
          # Lint runs before the build and fails the job on an error, so a
          # broken deck is never published. On a pull request the diagnostics
          # come back as inline annotations on the changed lines.
          lint: true
          outputs: html,pdf,thumbnails
          out-dir: dist{{base_url}}

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.out-dir }}

      # A pull request builds but does not publish, so the build is only useful
      # if you can look at it: download `presentation` from the run summary to
      # open the deck, the PDF and the slide overview locally.
      - name: Upload the build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: presentation
          path: ${{ steps.build.outputs.out-dir }}

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
