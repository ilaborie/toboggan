[package]
name = "toboggan-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Igor Laborie <ilaborie@gmail.com>"]
description = "WebAssembly client for Toboggan presentation system"
repository = "https://github.com/ilaborie/toboggan"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# Size-optimize with wasm-pack's own managed binaryen, so a build needs nothing
# beyond wasm-pack itself. The feature flags are required: rustc emits both
# bulk-memory and non-trapping float-to-int ops, which wasm-opt rejects by
# default.
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[workspace]
# This empty workspace table prevents the package from inheriting workspace settings


[dependencies]
toboggan-core = { path = "../../toboggan-core", features = ["js"] }

wasm-bindgen = "0.2.126"
gloo = { version = "0.12.0", default-features = false, features = [
  "timers",
  "events",
  "console",
  "utils",
  "net",
] }
web-sys = { version = "0.3.103", features = [
  "BeforeUnloadEvent",
  "HtmlElement",
  "HtmlDialogElement",
  "KeyboardEvent",
  "Element",
  "CssStyleDeclaration",
  "Document",
  "Node",
  "NodeList",
  "ShadowRoot",
  "ShadowRootInit",
  "ShadowRootMode",
  "AudioContext",
  "AudioDestinationNode",
  "AudioParam",
  "OscillatorNode",
  "GainNode",
  "OscillatorType",
  "Window",
  "HtmlCanvasElement",
  "DomTokenList",
  "ResizeObserver",
] }
js-sys = "0.3.103"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.76"
futures = "0.3.32"
serde = "1.0.228"
console_error_panic_hook = "0.1.7"
# The terminal emulator itself is the `rioterm` npm package (Rio's VT core
# compiled to wasm), bound from Rust in components/terminal/rioterm.rs. It is a
# JS dependency, declared in toboggan-web/package.json — nothing to add here.

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_docs = "allow"

[lints.clippy]
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"

dbg_macro = "warn"
empty_line_after_doc_comments = "warn"
expect_used = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
large_include_file = "warn"
min_ident_chars = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"

new_without_default = "allow"
module_name_repetitions = "allow"

# WASM size optimizations
[profile.release]
opt-level = "z"   # Optimize for size even more aggressively
lto = "fat"       # More aggressive LTO
codegen-units = 1 # Single codegen unit for better optimization
panic = "abort"   # Smaller panic handling
strip = true      # Strip symbols for smaller size
