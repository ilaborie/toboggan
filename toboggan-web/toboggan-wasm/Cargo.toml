[package]
name = "toboggan-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Igor Laborie <ilaborie@gmail.com>"]
description = "WebAssembly client for Toboggan presentation system"
repository = "https://github.com/ilaborie/toboggan"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# Size-optimize with wasm-pack's own managed binaryen, so a build needs nothing
# beyond wasm-pack itself. The feature flags are required: rustc emits both
# bulk-memory and non-trapping float-to-int ops, which wasm-opt rejects by
# default.
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
toboggan-core = { path = "../../toboggan-core", features = ["js"] }

wasm-bindgen = "0.2.126"
gloo = { version = "0.12.0", default-features = false, features = [
  "timers",
  "events",
  "console",
  "utils",
  "net",
] }
web-sys = { version = "0.3.103", features = [
  "BeforeUnloadEvent",
  "HtmlElement",
  "HtmlDialogElement",
  "KeyboardEvent",
  "Element",
  "CssStyleDeclaration",
  "Document",
  "Node",
  "NodeList",
  "ShadowRoot",
  "ShadowRootInit",
  "ShadowRootMode",
  "AudioContext",
  "AudioDestinationNode",
  "AudioParam",
  "OscillatorNode",
  "GainNode",
  "OscillatorType",
  "Window",
  "HtmlCanvasElement",
  "DomTokenList",
  "ResizeObserver",
] }
js-sys = "0.3.103"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.76"
futures = "0.3.32"
serde = "1.0.228"
console_error_panic_hook = "0.1.7"
# The terminal emulator itself is the `rioterm` npm package (Rio's VT core
# compiled to wasm), bound from Rust in components/terminal/rioterm.rs. It is a
# JS dependency, declared in toboggan-web/package.json — nothing to add here.

# No dev-dependencies: this crate cannot host a unit test. Its bindings
# `require("rioterm")`, which only a bundler resolves, so `wasm-bindgen-test`
# fails to load the module in both Node and a browser. Logic worth testing is
# kept in `toboggan-core` instead — see `accumulate_goto` and `goto_command`,
# which both clients now share — and the rendered result is covered by the
# Playwright suite in `toboggan-web/tests`.
[dev-dependencies]

[lints]
workspace = true
