[package]
name = "toboggan-py"
version = "0.1.0"
description = "Python bindings for Toboggan presentations using PyO3"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Igor Laborie <ilaborie@gmail.com>"]
repository = "https://github.com/ilaborie/toboggan"

[lib]
name = "toboggan_py"
crate-type = ["cdylib"]

[dependencies]
toboggan-core = { path = "../toboggan-core", default-features = false, features = [
  "std",
] }
toboggan-client = { path = "../toboggan-client" }

pyo3 = { version = "0.29.0", features = ["abi3-py38"] }
# `log` so the records reach `pyo3-log`, which is a `log::Log` implementation:
# that is the bridge onto Python's own `logging`, and the reason an importable
# extension module has no business writing to stdout.
tracing = { version = "0.1.44", features = ["log"] }
pyo3-log = "0.13.4"
tokio = { version = "1.53.0", features = [
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
] }

# Spelled out rather than inherited: this crate is excluded from the workspace
# (it is a cdylib built by maturin), so `workspace = true` is not available to
# it. Kept in step with the workspace's own table by hand.
[lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_docs = "allow"

[lints.clippy]
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"

dbg_macro = "warn"
empty_line_after_doc_comments = "warn"
expect_used = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
large_include_file = "warn"
min_ident_chars = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"

missing-errors-doc = "allow"
module_name_repetitions = "allow"
