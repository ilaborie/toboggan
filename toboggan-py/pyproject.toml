[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "toboggan-py"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]

# Dev-only. The wheel itself has no dependencies — `requires-python` and the
# abi3-py38 build govern what it installs into, not what building it needs.
[dependency-groups]
dev = ["maturin>=1.9,<2.0", "pytest>=8", "pytest-timeout>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A binding that hangs is the failure mode these tests exist to catch, and an
# unbounded hang in CI is a job that burns to the platform limit with no output
# rather than a red test. Generous enough for a cold `cargo run` server start.
timeout = 300
markers = [
  "slow: waits out a real timeout rather than a shortened copy of one",
]
# `conftest.py` exports helpers the role tests import by name; without this the
# tests directory is not on the path for them to do so.
pythonpath = ["tests"]
