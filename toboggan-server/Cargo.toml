[package]
name = "toboggan-server"
version.workspace = true
description = "Axum WebSocket server with REST API and real-time presentation synchronization"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
toboggan-core = { path = "../toboggan-core", features = ["openapi"] }
toboggan-stats = { path = "../toboggan-stats" }
toboggan-cli = { path = "../toboggan-cli" }

axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true, features = ["env", "derive"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower-http = { workspace = true, features = [
  "trace",
  "cors",
  "fs",
  "set-header",
] }
futures = { workspace = true }
slotmap = { workspace = true, features = ["serde"] }
derive_more = { workspace = true, features = ["display", "error"] }
utoipa = { workspace = true }
utoipa-scalar = { workspace = true, features = ["axum"] }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
notify = { workspace = true }
portable-pty = { workspace = true }
open = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
toboggan-core = { path = "../toboggan-core", features = [
  "openapi",
  "test-utils",
] }
clawspec-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio-tungstenite = { workspace = true, features = [
  "connect",
  "rustls-tls-native-roots",
] }
tower = { workspace = true, features = ["util"] }

[[test]]
name = "multi_client_sync"
harness = true

[lints]
workspace = true
