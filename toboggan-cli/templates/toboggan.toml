# Toboggan configuration for "{{title}}".
#
# Everything here is optional, and every key has a matching command-line flag.
# Precedence, strongest first:
#
#   CLI flag  >  TOBOGGAN_* environment variable  >  this file  >  built-in default
#
# So a value set here is a default *for this deck*, and any flag you type still
# wins. The file is also looked for in parent directories (handy for a repo of
# several decks) and finally in ~/.config/toboggan/config.toml.
#
# Uncomment what you want to change; the value shown is the built-in default.

# Deck folder, relative to this file. Change it if your slides do not live in a
# sibling `slides/` directory.
# path = "."

# What a bare `toboggan` does. One of: serve, lint, stats, build, pdf, thumbnails.
# `serve` builds the deck in memory and serves it with live reload.
# default-command = "serve"

[build]
# Override the deck title and date; by default they come from slides/_cover.md.
# title = "{{title}}"
# date = "{{date}}"

# Language of the deck, as a BCP 47 tag. It becomes the `lang` attribute on
# every page Toboggan renders, which is what tells a screen reader how to
# pronounce the deck and a browser how to hyphenate it. `slides/_cover.md` can
# set it in its frontmatter instead; this wins.
# lang = "en"

# Base URL the exported HTML is served from, for `toboggan build -o deck.html`.
# The deck's `public/` assets are referenced relative to the exported file by
# default (and copied next to it), which is right on a GitHub Pages project page
# as well as at a site root. Set this only if they must be addressed absolutely.
# base-url = "/my-talk/"

# Syntax-highlighting theme for code blocks. `toboggan build --list-themes`
# prints the available names.
# theme = "base16-ocean.light"

# Mermaid configuration for ```mermaid fences, as a JSON file in Mermaid's own
# config shape: `theme`, `themeVariables`, `preferredAspectRatio`, `flowchart`.
# The path is relative to this file. Individual fences override it with
# `mermaid:theme=dark,rankSpacing=80`.
# mermaid-config = "mermaid.json"

# Typst preamble for the `.typ` and PDF output, replacing the generated one —
# the touying theme and the aspect ratio are chosen there, and neither can be
# taken back by anything written afterwards. The path is relative to this file,
# and it overrides the deck's own `slides/_preamble.typ`.
# A replacement owns everything the generated preamble set up: the imports
# (touying, codly, codly-languages, gentle-clues, mitex), a theme show-rule that
# suppresses the theme's own heading display — the slide body emits its own
# `== <title>`, so without it every title prints twice (`subslide-preamble: none`
# for themes.simple, `header: none` for themes.metropolis) — and
# `#show: codly-init.with()` with `#codly(languages: codly-languages)`.
# typst-preamble = "preamble.typ"

# Speaking rate used for the duration estimates in `toboggan stats`.
# wpm = 150

# Turn off automatic part/slide numbering.
# no-counter = false

# Leave speaker notes out of the duration estimates.
# exclude-notes-from-duration = false

[serve]
# Keep the port at 8080 unless you know what you are doing: the embedded web
# client connects to 8080 and will not find a server on another port.
# port = 8080
# host = "127.0.0.1"
# max-clients = 100

# Extra CORS origins allowed to talk to the server.
# allowed-origins = ["https://example.com"]

# Asset folder served at /public/ (default: a `public/` sibling of the slides).
# public-dir = "public"

# Pre-generated `toboggan thumbnails` output to serve at /overview/.
# thumbnails-dir = "overview"

# Shell spawned for embedded terminals (default: your $SHELL).
# shell = "fish"

# Open the presentation in a browser once the server is ready.
# open = false

# Also open the presenter view — notes, the next slide, and a timer. Implies
# `open`. Two windows for one talk: this one on your screen, the deck on the
# projector.
# open-presenter = false

# Secret that lets a client somewhere other than this machine drive the deck.
# Only relevant with `host` opened up: a client on this machine always presents,
# and without a token a client on the network can watch but not navigate, and
# cannot open the embedded terminals. Remote clients pass it in the URL —
# `http://<your-ip>:8080/run?token=…`.
# presenter-token = "change-me"

[overview]
# How the slide overview at /slides draws its thumbnails, and what
# `toboggan thumbnails` writes.
#
#   auto     photograph the real deck in a headless browser when one can be
#            found, and fall back to Typst when it cannot
#   browser  photograph it, and fail rather than fall back — what you want in
#            CI, where a silent switch to the approximate renderer changes how
#            a published site looks
#   typst    redraw the deck as a Typst document; needs the `typst` binary
#            rather than a browser, and cannot render a slide's HTML, CSS or
#            terminals
# thumbnail-renderer = "auto"

# Browser used to photograph the slides. Detected from $CHROME, your PATH and
# the usual install locations for Chrome, Chromium and Edge when not set.
# browser = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

[lint]
# Severity at or above which `toboggan lint` exits non-zero: info, warning, error.
# deny = "error"

# Skip spell checking (it runs via the `typos` CLI when that is installed).
# no-spell = false

# How the report is rendered: human, json, github, or sarif. `github` prints
# workflow commands, which a GitHub Actions run turns into annotations on the
# slide files themselves; `sarif` feeds code scanning.
# format = "human"

# Per-slide budgets before the corresponding rule complains.
# max-steps-per-slide = 20
# max-words-per-slide = 120
# max-images-per-slide = 8
# max-code-lines = 20

# Two rules stay silent until you set these, because no deck has a natural
# length and plenty deliberately carry no speaker notes.
#
# max-duration is the slot you were given; `structure/over-budget` compares it
# against the `duration` your slides declare in their front matter. Seconds or
# a humantime string.
# max-duration = "45m"
# require-notes = true

# Rules to switch off entirely, by id. `toboggan lint` names the id of every
# diagnostic it reports, and an unknown id here is reported rather than ignored.
# disabled = ["spelling/typo"]

# Change a rule's severity instead of disabling it.
# [lint.severity]
# "content/excessive-words" = "info"

# Note on the boolean keys above (no-counter, open, no-spell, …): a flag can turn
# one on, but cannot turn one back off if it is enabled here. If you need it off
# for a single run, comment it out rather than passing a flag.
