[package]
name = "toboggan-cli"
version.workspace = true
edition.workspace = true
description = "Folder parser and renderers (toml/json/yaml/html/typst) behind the Toboggan CLI"
keywords = ["presentation", "slides", "markdown", "toml", "parser"]
categories = ["text-processing"]
repository = "https://github.com/ilaborie/toboggan"
documentation = "https://docs.rs/toboggan-cli"
readme = "README.md"
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.cargo-machete]
# phf_codegen is pulled in only to force its `ptrhash` feature on comrak's build
# script; we have no build script of our own. See the comment on it below.
ignored = ["phf_codegen"]

[dependencies]
toboggan-core = { path = "../toboggan-core", features = ["std"] }
toboggan-stats = { path = "../toboggan-stats" }

toml = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["env", "derive"] }
serde = { workspace = true, features = ["derive"] }
miette = { workspace = true, features = ["fancy"] }
derive_more = { workspace = true, features = ["error", "from", "display"] }
comrak = { workspace = true }
math-core = { workspace = true }
mermaid-rs-renderer = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
humantime = { workspace = true }
comfy-table = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
# math-core turns on phf's `ptrhash`, which changes the layout of `phf::Map`, and
# features unify: comrak gets that layout too. comrak's build script still
# generates its entity table with plain `phf_codegen`, which emits the old one
# (`no field named disps`). Turning `ptrhash` on here makes the generated table
# match. Drop this once comrak passes the feature through itself.
phf_codegen = { workspace = true, features = ["ptrhash"] }

[lints]
workspace = true
