name: Build Toboggan presentation
description: >-
  Build a Toboggan presentation folder into a single-file HTML, a PDF, and/or a
  slide overview with thumbnails. Intended for use in a presentation repository.
author: Igor Laborie

inputs:
  folder:
    description: Path to the slides folder to build.
    required: false
    default: ./slides
  outputs:
    description: Comma-separated artifacts to produce (html, pdf, thumbnails).
    required: false
    default: html,pdf,thumbnails
  out-dir:
    description: Directory to write artifacts into.
    required: false
    default: dist
  version:
    description: >-
      Release tag of ilaborie/toboggan to install, e.g. v0.1.0. Pinned by
      default so that a CLI change cannot alter what an already-published ref of
      this action runs. "latest" is accepted but re-opens exactly that hole.
    required: false
    default: v0.1.0

outputs:
  out-dir:
    description: Directory containing the built artifacts.
    value: ${{ inputs.out-dir }}

runs:
  using: composite
  steps:
    # Installed from this repository's own releases, which is the only place the
    # real binary exists. The crate name `toboggan` on crates.io belongs to an
    # unrelated project, so `cargo binstall toboggan` — what this step used to
    # run — fetched a stranger's binary of the same name and every build below
    # then failed on unrecognised arguments.
    #
    # There is deliberately no build-from-source fallback: `toboggan-server`
    # embeds `toboggan-web/dist` at compile time and its build.rs fails when that
    # folder is absent, and the folder is a gitignored artifact of the separate
    # wasm/vite pipeline. A source build would therefore fail anyway, later and
    # less clearly. Failing here names the missing release instead.
    - name: Install toboggan
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPOSITORY: ilaborie/toboggan
      run: |
        set -euo pipefail
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  target=x86_64-unknown-linux-gnu ;;
          Darwin-arm64)  target=aarch64-apple-darwin ;;
          # Intel macOS lands here on purpose: no release is built for it.
          *) echo "::error::no toboggan release for runner $(uname -s)-$(uname -m)"; exit 1 ;;
        esac

        # `releases/latest/download/…` is GitHub's own alias; every other value
        # is treated as a tag, so a typo 404s loudly rather than silently
        # installing something else.
        if [ "$VERSION" = "latest" ]; then
          url="https://github.com/$REPOSITORY/releases/latest/download/toboggan-$target.tar.gz"
        else
          url="https://github.com/$REPOSITORY/releases/download/$VERSION/toboggan-$target.tar.gz"
        fi

        dir="$RUNNER_TEMP/toboggan-bin"
        mkdir -p "$dir"
        if ! curl -fsSL "$url" | tar -xz -C "$dir"; then
          echo "::error::could not download $url — is the release published for this target?"
          exit 1
        fi
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/toboggan" --version

    - name: Install Typst
      if: contains(inputs.outputs, 'pdf') || contains(inputs.outputs, 'thumbnails')
      uses: typst-community/setup-typst@v5

    - name: Build artifacts
      shell: bash
      # Inputs go through the environment rather than `${{ }}` interpolation, so
      # a value containing shell metacharacters is data, never code.
      env:
        FOLDER: ${{ inputs.folder }}
        OUT_DIR: ${{ inputs.out-dir }}
        OUTPUTS: ${{ inputs.outputs }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT_DIR"
        IFS=',' read -ra kinds <<< "$OUTPUTS"
        for kind in "${kinds[@]}"; do
          case "$(echo "$kind" | xargs)" in
            html)       toboggan build --path "$FOLDER" --output "$OUT_DIR/index.html" ;;
            pdf)        toboggan pdf --path "$FOLDER" --output "$OUT_DIR/presentation.pdf" ;;
            thumbnails) toboggan thumbnails --path "$FOLDER" --output "$OUT_DIR/overview" ;;
            "")         ;;
            # Without this arm a typo (`thumbnail`) produced nothing at all and
            # still exited 0, so the workflow "succeeded" with no artifacts.
            *)          echo "::error::unknown output kind: $kind" >&2; exit 1 ;;
          esac
        done
