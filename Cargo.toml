[workspace]
members = [
  "toboggan-core",
  "toboggan-stats",
  "toboggan-server",
  "toboggan-cli",
  "toboggan-client",
  "toboggan-tui",
  "toboggan-desktop",
  "toboggan-mobile",
  "toboggan-lint",
  "toboggan-mcp",
  "toboggan",
]
# `toboggan-web` is its own workspace (wasm32-only crates, built by wasm-pack).
exclude = ["toboggan-py", "toboggan-web"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Igor Laborie <ilaborie@gmail.com>"]
repository = "https://github.com/ilaborie/toboggan"

[workspace.dependencies]
# Core dependencies
derive_more = { version = "2.1.1", default-features = false }
jiff = { version = "0.2.38", default-features = false }
serde = { version = "1.0.229", default-features = false }
humantime = "2.4.0"
getrandom = "0.4.3"

# Server dependencies
axum = "0.8.9"
tokio = "1.53.2"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = "4.6.7"
clap_complete = "4.6.11"
anyhow = "1.0.104"
serde_json = "1.0.151"
serde-saphyr = "1.3.0"
tower-http = "0.7.1"
futures = "0.3.34"
slotmap = "1.1.1"

# OpenAPI dependencies
utoipa = "6.0.0"
utoipa-scalar = "0.4.0"

# Dev dependencies
clawspec-core = "0.5.0"
tempfile = "3.27.0"
tower = "0.5.3"

# Other dependencies
comrak = "0.56.0"
phf_codegen = "0.14.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
math-core = { version = "0.8.0", default-features = false }
miette = "7.6.0"
comfy-table = "8.0.1"

# Desktop dependencies
iced = "0.14.0"
tokio-tungstenite = { version = "0.30.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
lucide-icons = "1.55.0"
async-stream = "0.3.6"

# Other dependencies
scraper = "0.27.0"

# Server-specific dependencies
rust-embed = "8.13.0"
# Drives a headless Chrome over the DevTools protocol, to photograph `/run` for
# the slide overview. `default-features = false` drops the Chromium downloader:
# a browser is found on the machine or the feature degrades, never fetched.
chromiumoxide = { version = "0.9.1", default-features = false, features = [
  "bytes",
] }
mime_guess = "2.0.5"
notify = "8.2.0"
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
open = "5.4.4"

# MCP-specific dependencies
rmcp = "3.5.1"
schemars = "1"
toml_edit = "0.25.17"

# Desktop-specific dependencies
# naga = "29"
naga = "30"

# CLI-specific dependencies
owo-colors = "4.4.0"

# TUI-specific dependencies
ratatui = "0.30.2"
crossterm = "0.29.0"
tui-logger = "0.18.3"
tachyonfx = "0.25"

# Mobile-specific dependencies (iOS & Android)
uniffi = "0.32.2"


[workspace.lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"

dbg_macro = "warn"
empty_line_after_doc_comments = "warn"
expect_used = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
large_include_file = "warn"
min_ident_chars = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"

missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
