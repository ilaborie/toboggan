[workspace]
members = [
  "toboggan-core",
  "toboggan-stats",
  "toboggan-server",
  "toboggan-cli",
  "toboggan-client",
  "toboggan-tui",
  "toboggan-desktop",
  "toboggan-mobile",
  "toboggan-lint",
  "toboggan-mcp",
  "toboggan",
]
exclude = ["toboggan-esp32", "toboggan-py"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Igor Laborie <ilaborie@gmail.com>"]
repository = "https://github.com/ilaborie/toboggan"

[workspace.dependencies]
# Core dependencies
derive_more = { version = "2.1.1", default-features = false }
jiff = { version = "0.2.28", default-features = false }
serde = { version = "1.0.228", default-features = false }
uuid = { version = "1.23.3", default-features = false }
humantime = "2.3.0"
getrandom = "0.4.2"

# Server dependencies
axum = "0.8.9"
tokio = "1.52.3"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = "4.6.1"
anyhow = "1.0.102"
serde_json = "1.0.150"
serde-saphyr = "0.0.29"
tower-http = "0.7.0"
futures = "0.3.32"
dashmap = "6.2.1"
slotmap = "1.1.1"

# OpenAPI dependencies
utoipa = "5.5.0"
utoipa-scalar = "0.3.0"

# Dev dependencies
clawspec-core = "0.4.3"
tempfile = "3.27.0"

# Other dependencies
comrak = "0.53.0"
miette = "7.6.0"
comfy-table = "7.2.2"

# Desktop dependencies
iced = "0.14.0"
tokio-tungstenite = { version = "0.29.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
lucide-icons = "1.18.0"
async-stream = "0.3.6"

# Other dependencies
scraper = "0.27.0"

# Server-specific dependencies
rust-embed = "8.11.0"
mime_guess = "2.0.5"
notify = "8.2.0"
portable-pty = "0.9.0"
open = "5.3.2"

# MCP-specific dependencies
rmcp = "2.2.0"
schemars = "1"
toml_edit = "0.25.12"

# Desktop-specific dependencies
# naga = "29"
naga = "30"

# CLI-specific dependencies
owo-colors = "4.3.0"

# TUI-specific dependencies
ratatui = "0.30.1"
crossterm = "0.29.0"
tui-logger = "0.18.2"
tachyonfx = "0.25"

# Mobile-specific dependencies (iOS & Android)
uniffi = "0.32.0"


[workspace.lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"

dbg_macro = "warn"
empty_line_after_doc_comments = "warn"
expect_used = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
large_include_file = "warn"
min_ident_chars = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"

missing-errors-doc = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
