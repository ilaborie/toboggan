[package]
name = "toboggan-mobile"
version.workspace = true
description = "Mobile library for Toboggan presentations with UniFFI bindings for Swift and Kotlin"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true


[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "toboggan"

[[bin]]
name = "uniffi-bindgen"
path = "./uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "./uniffi-bindgen-swift.rs"


[dependencies]
toboggan-core = { path = "../toboggan-core", features = ["std"] }
toboggan-client = { path = "../toboggan-client" }

uniffi = { workspace = true, features = ["cli"] }
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }

[dev-dependencies]

[lints]
workspace = true
